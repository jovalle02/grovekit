# Generated by `grove adapt render`. Applied on top of the base compose file,
# which is never modified — plain `docker compose up` still works.
#
#   ports: !reset []   cancels the base file's published ports (Compose >= 2.24)
#   ports: !override   REPLACES them. `!reset` erases the key and ignores any
#                      value you give it, so `!reset ["${WT_PORT_DB}:5432"]`
#                      publishes nothing at all.
#   *.internal alias   unambiguous name for sibling calls — a bare `api` is
#                      ambiguous on the shared proxy network, where every
#                      worktree has one.
services:
  api:
    ports: !reset []
    environment:
      WT_NAME: ${WT_NAME}
    networks:
      internal:
        aliases:
          - api.internal
      wt-proxy: {}
    labels:
      - traefik.enable=true
      - traefik.http.routers.${WT_NAME}-api.rule=Host(`api.${WT_NAME}.${WT_DOMAIN}`)
      - traefik.http.services.${WT_NAME}-api.loadbalancer.server.port=4000
      - wt.managed=true

  db:
    # Not HTTP, so the proxy cannot front it: it keeps a real host port,
    # leased per worktree instead of hardcoded.
    ports: !override
      - "${WT_PORT_DB}:5432"
    environment:
      WT_NAME: ${WT_NAME}
    networks:
      internal:
        aliases:
          - db.internal
    labels:
      - wt.managed=true

  web:
    ports: !reset []
    environment:
      API_URL: http://api.internal:4000
      NEXT_PUBLIC_API_URL: http://api.${WT_NAME}.${WT_DOMAIN}:8081
      WT_NAME: ${WT_NAME}
    networks:
      internal:
        aliases:
          - web.internal
      wt-proxy: {}
    labels:
      - traefik.enable=true
      - traefik.http.routers.${WT_NAME}-web.rule=Host(`web.${WT_NAME}.${WT_DOMAIN}`)
      - traefik.http.services.${WT_NAME}-web.loadbalancer.server.port=3000
      - wt.managed=true

networks:
  internal:
  wt-proxy:
    external: true
    name: ${WT_PROXY_NETWORK}
