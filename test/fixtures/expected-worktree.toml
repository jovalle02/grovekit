# Generated by `grove adapt render`. Edit freely — this file is yours.
[project]
name = "sample-app"
compose = ["docker-compose.yml", "docker-compose.worktree.yml"]

[domain]
# localtest.me is real public DNS with a wildcard pointing at 127.0.0.1.
# *.localhost is NOT resolvable by the Windows resolver, curl, or Node fetch.
suffix = "localtest.me"

[proxy]
# 80 gives the cleanest URLs, but Docker Desktop often holds it even with no
# containers running. Any port works; URLs then carry it.
port = 8081

[[services]]
name = "api"
layer = "backend"
subdomain = "api"
port = 4000
health = "/healthz"
# medium confidence: listens on 4000 and is built from source

[[services]]
name = "db"
layer = "data"
host_port = true
health = { exec = ["pg_isready", "-U", "app"] }

[[services]]
name = "web"
layer = "frontend"
subdomain = "web"
port = 3000
health = "/healthz"
# medium confidence: listens on 3000 and is built from source

[groups]
backend = ["api", "db"]
data = ["db"]

# Interpolated against the vars `grove run` injects.
[env]
DATABASE_URL = "postgres://app:app@${WT_HOST_DB}/app"

# Review before trusting this file:
#   - web: assumed HTTP and given a URL, dropping its published port
