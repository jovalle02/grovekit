[project]
name = "sample-app"
compose = ["docker-compose.yml", "docker-compose.worktree.yml"]

[domain]
suffix = "localtest.me"

[proxy]
# 80 gives the cleanest URLs, but Docker Desktop on Windows often holds it even
# with no containers running. Any port works; URLs then carry it.
port = 8081

[[services]]
name = "web"
layer = "frontend"
subdomain = "web"
port = 3000
health = "/healthz"

[[services]]
name = "api"
layer = "backend"
subdomain = "api"
port = 4000
health = "/healthz"

[[services]]
name = "db"
layer = "data"
host_port = true
health = { exec = ["pg_isready", "-U", "app"] }

[groups]
backend = ["api", "db"]
frontend = ["web", "api", "db"]

# Interpolated against the vars `grove run` injects (WT_HOST_DB is `localhost:<lease>`).
[env]
DATABASE_URL = "postgres://app:app@${WT_HOST_DB}/app"

[commands]
e2e = "node e2e.mjs"

# What a fresh worktree needs and git will not bring - every path here is
# gitignored by definition. Copy what you may edit per worktree; link what is
# large and identical. `grove` hashes the lockfiles to choose between `link` and
# `run`: identical means sharing one node_modules is safe, different means the
# branch changed its dependencies and it installs instead.
#
# This fixture has no dependencies, so only `copy` does anything here.
[hydrate]
copy = [".env"]
