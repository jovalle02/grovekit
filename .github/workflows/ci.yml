name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Windows is not an afterthought here: the junction link type, the `.cmd`
    # shim quoting in `grove run` and the port-reservation behaviour that defeats a
    # socket probe are all Windows-specific, and all three cost real debugging.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ["20.11", "22", "24"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Configure git
        # `grove new` and `grove rm` drive real worktrees, which git refuses to do
        # without an identity.
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "ci"
          git config --global init.defaultBranch main

      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    # The suite that boots real stacks. Linux only - it needs a Docker daemon,
    # and the hosted Windows and macOS runners do not have one.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - name: Configure git
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "ci"
          git config --global init.defaultBranch main

      - run: npm test
        env:
          WT_TEST_DOCKER: "1"

      - name: Collect docker state on failure
        if: failure()
        run: docker ps --all && docker logs "$(docker ps -aq --filter label=com.docker.compose.project=easy-worktree-proxy | head -1)" || true
